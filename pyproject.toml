[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointvlm"
version = "0.1.0"
description = "Teaching a small VLM to point: frozen evals, SFT, GRPO, quantization."
requires-python = ">=3.10"
dependencies = [
	"numpy",
	"pillow",
	"pycocotools>=2.0.7",
	"scipy",
	"datasets>=2.20.0",
	"huggingface_hub>=0.24",
]

[project.optional-dependencies]
models = ["torch>=2.3.0", "transformers>=4.57.0", "accelerate", "einops", "torchvision"]
train = ["localtrainer @ git+https://github.com/sks3i/localtrainer.git@vlm-sft", "peft", "bitsandbytes", "requests"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["pointeval*", "pointtrain*"]
